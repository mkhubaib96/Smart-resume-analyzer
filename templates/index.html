{% extends "base.html" %}
{% block title %}Upload Resume{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-3">Upload your resume</h4>
                <form action="{{ url_for('analyze') }}" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Resume file (PDF or DOCX)</label>
                        <input class="form-control" type="file" name="resume" accept=".pdf,.docx" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Target role</label>
                        <select class="form-select" name="target_role" required>
                            {% for role in roles %}
                                <option value="{{ role }}">{{ role }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Analyze Resume</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
